<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TripiiTrip Levels</title>
</head>
<body style="margin:0; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color:white; display:flex; justify-content:center; align-items:center; height:100vh;">

  <div style="width:400px; background:#1e293b; border-radius:20px; padding:20px; box-shadow:0 0 20px rgba(0,0,0,0.4);">
    <div style="text-align:center; margin-bottom:20px;">
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" style="width:80px; height:80px; border-radius:50%; border:3px solid #38bdf8;">
      <h2 style="margin:10px 0 5px 0;">Rishav Kumar</h2>
      <p style="color:#94a3b8; font-size:14px;">@rishav_wanderer</p>
    </div>

    <div style="background:#0f172a; border-radius:15px; padding:15px; margin-bottom:20px;">
      <h3 style="margin:0 0 10px 0; color:#38bdf8;">Level 1: Nomad 🧭</h3>
      <div style="height:10px; background:#334155; border-radius:10px; overflow:hidden;">
        <div style="width:40%; height:10px; background:linear-gradient(90deg, #38bdf8, #06b6d4);"></div>
      </div>
      <p style="font-size:13px; color:#cbd5e1; margin-top:5px;">420 XP / 1000 XP</p>
    </div>

    <div style="background:#0f172a; border-radius:15px; padding:15px; margin-bottom:20px;">
      <h3 style="margin:0 0 10px 0; color:#a78bfa;">Level 2: Wanderer 🌍</h3>
      <div style="height:10px; background:#334155; border-radius:10px; overflow:hidden;">
        <div style="width:70%; height:10px; background:linear-gradient(90deg, #a78bfa, #8b5cf6);"></div>
      </div>
      <p style="font-size:13px; color:#cbd5e1; margin-top:5px;">2100 XP / 3000 XP</p>
    </div>

    <div style="background:#0f172a; border-radius:15px; padding:15px;">
      <h3 style="margin:0 0 10px 0; color:#fbbf24;">Level 3: Legend 🏆</h3>
      <div style="height:10px; background:#334155; border-radius:10px; overflow:hidden;">
        <div style="width:85%; height:10px; background:linear-gradient(90deg, #facc15, #f59e0b);"></div>
      </div>
      <p style="font-size:13px; color:#cbd5e1; margin-top:5px;">4800 XP / 5600 XP</p>
    </div>
  </div>

</body>
</html>
